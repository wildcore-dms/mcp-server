services:
  wildcore-mcp:
    image: ghcr.io/wildcore-dms/mcp-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
