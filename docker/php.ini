; RoadRunner workers and stdio run as CLI: PHP itself never parses HTTP request bodies.
; Uploads and upload progress are disabled as well in case of another SAPI (CVE-2026-109618/109619) -
; defense in depth only, not a replacement for a patched PHP.
enable_post_data_reading = Off
file_uploads = Off
session.upload_progress.enabled = 0
expose_php = Off
display_errors = stderr
html_errors = Off
log_errors = On
memory_limit = 256M
opcache.enable_cli = 1
